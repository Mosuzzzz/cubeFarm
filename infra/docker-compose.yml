services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartfarm}
      POSTGRES_USER: ${POSTGRES_USER:-smartfarm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      # PostgreSQL 18+ stores clusters below a major-version directory.
      - postgres_data:/var/lib/postgresql
      - ../services/api/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      # ESP32 connects from the local LAN; do not forward this port on the router.
      - "1883:1883"

  api:
    build: ../services/api
    environment:
      HTTP_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-smartfarm}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-smartfarm}?sslmode=disable
      MQTT_BROKER_URL: tcp://mosquitto:1883
      MQTT_USERNAME: ${MQTT_USERNAME:-smartfarm}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-change-me}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.8-27b}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
      LINE_LOGIN_CHANNEL_ID: ${LINE_LOGIN_CHANNEL_ID:-}
      LINE_OWNER_USER_ID: ${LINE_OWNER_USER_ID:-}
      LINE_CHANNEL_ID: ${LINE_CHANNEL_ID:-}
      LIFF_ALLOWED_USER_ID: ${LIFF_ALLOWED_USER_ID:-}
      LINE_MESSAGING_CHANNEL_ACCESS_TOKEN: ${LINE_MESSAGING_CHANNEL_ACCESS_TOKEN:-}
      LINE_NOTIFY_USER_ID: ${LINE_NOTIFY_USER_ID:-}
    depends_on:
      postgres: { condition: service_healthy }
      mosquitto: { condition: service_started }

  web:
    build:
      context: ../apps/mini-app
      args:
        # Browser and API share the Nginx/Cloudflare origin in Docker.
        NEXT_PUBLIC_API_BASE_URL: ""
        NEXT_PUBLIC_LIFF_ID: ${LIFF_ID:-}
    depends_on: [api]

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8088:80"
    depends_on: [web, api]

volumes:
  postgres_data:
